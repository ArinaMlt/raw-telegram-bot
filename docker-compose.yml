version: "3.8"

services:
  telegram-bot:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: mybot/telegram-bot:${APP_VERSION:-dev}
    container_name: hello-world-bot
    restart: unless-stopped
    env_file:
      - .env
    # логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
